<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — AI Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="url(#g1)"/><defs><linearGradient id="g1" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="var(--accent-1)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs></svg>
        </span>
        <span class="brand-name">Nova</span>
      </div>
      <button class="icon-btn" id="collapseBtn" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>New chat</span>
    </button>

    <div class="sidebar-section-label">Recent</div>
    <nav class="history-list" id="historyList"><!-- history items injected --></nav>

    <div class="sidebar-bottom">
      <div class="theme-toggle" id="themeToggle" title="Toggle theme" role="button" tabindex="0">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" fill="currentColor"/></svg>
      </div>
      <div class="user-chip">
        <span class="avatar user-avatar">U</span>
        <div class="user-meta">
          <span class="user-name">Guest</span>
          <span class="user-sub">Free plan</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main chat -->
  <main class="chat-main">
    <header class="chat-header">
      <button class="icon-btn sidebar-toggle-btn" id="sidebarToggleBtn" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="header-info">
        <span class="header-avatar">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="url(#g2)"/><defs><linearGradient id="g2" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="var(--accent-1)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs></svg>
        </span>
        <div class="header-text">
          <h1>Nova</h1>
          <span class="status"><span class="status-dot"></span>Online</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="clearBtn" title="Clear conversation" aria-label="Clear conversation">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-messages" id="chatMessages">

        <!-- Empty state -->
        <div class="empty-state" id="emptyState">
          <div class="empty-glow"></div>
          <span class="empty-mark">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="url(#g3)"/><defs><linearGradient id="g3" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="var(--accent-1)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs></svg>
          </span>
          <h2>How can I help you today?</h2>
          <p>Ask me anything — I can explain, brainstorm, write, and more.</p>
          <div class="suggestions" id="suggestions">
            <button class="suggestion-chip" data-text="Explain quantum computing in simple terms">
              <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              Explain quantum computing simply
            </button>
            <button class="suggestion-chip" data-text="Write a short poem about the ocean at night">
              <svg viewBox="0 0 24 24"><path d="M4 19c4-6 12-6 16 0M4 13c4-4 12-4 16 0M4 7c4-2 12-2 16 0" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
              Write a poem about the ocean
            </button>
            <button class="suggestion-chip" data-text="Give me a healthy dinner recipe idea">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
              Suggest a healthy dinner recipe
            </button>
            <button class="suggestion-chip" data-text="Help me plan a 3-day trip to Tokyo">
              <svg viewBox="0 0 24 24"><path d="M3 12l18-8-8 18-2-8-8-2Z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
              Plan a 3-day trip to Tokyo
            </button>
          </div>
        </div>

      </div>
    </div>

    <div class="composer">
      <form class="composer-form" id="composerForm">
        <button type="button" class="icon-btn attach-btn" id="attachBtn" title="Attach" aria-label="Attach">
          <svg viewBox="0 0 24 24"><path d="M21 11.5L12.5 20a4.5 4.5 0 0 1-6.4-6.4L14.8 5a3 3 0 0 1 4.3 4.3l-8.5 8.5a1.5 1.5 0 0 1-2.1-2.1l7.8-7.8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <textarea id="composerInput" rows="1" placeholder="Message Nova…" autofocus></textarea>
        <button type="submit" class="send-btn" id="sendBtn" disabled aria-label="Send message">
          <svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <div class="composer-hint">Nova can make mistakes. Check important info.</div>
    </div>
  </main>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>
</div>

<script src="script.js"></script>
</body>
</html>
